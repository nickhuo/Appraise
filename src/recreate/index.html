<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appraise · Recreate</title>
  <style>
    :root { --bg: #f7f7f5; --panel: #fff; --text: #1d1d1f; --muted: #6e6e73; --line: #e3e3e0; --chip: #efefec;
      --done: #1f8a4c; --todo: #2f6fed; --stop: #b26b00; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --bg: #151516; --panel: #1f1f21; --text: #f2f2f2; --muted: #9a9aa0; --line: #333336;
      --chip: #2b2b2e; --done: #4cc27f; --todo: #6b9bff; --stop: #e3a33b; } }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
    button:focus-visible { outline: 2px solid var(--todo); outline-offset: 2px; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header h1 { margin: 0; font-size: 17px; }
    .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
    .legend { display: flex; gap: 14px; margin-left: auto; color: var(--muted); font-size: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dot { display: inline-block; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
    .done { --c: var(--done); } .todo { --c: var(--todo); } .stop { --c: var(--stop); }
    main { display: grid; grid-template-columns: minmax(260px, 340px) auto minmax(280px, 1fr); height: calc(100vh - 50px); }
    nav { overflow: auto; padding: 10px 8px 40px; border-right: 1px solid var(--line); }
    ul.tree { list-style: none; margin: 0; padding-left: 16px; border-left: 1px dashed var(--line); }
    nav > ul.tree { padding-left: 2px; border-left: 0; }
    .node { display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 8px; border-radius: 8px; }
    .node[aria-current] { background: color-mix(in srgb, var(--todo) 15%, transparent); }
    .node img { flex: none; width: 30px; height: 54px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 4px; }
    .node strong { display: block; font-size: 13px; font-weight: 600; }
    .node small { color: var(--muted); font-size: 12px; }
    .count { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .link { display: block; padding: 1px 8px 1px 46px; color: var(--muted); font-size: 12px; }
    .stage-column { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 24px; overflow: auto; }
    .toolbar { display: flex; gap: 6px; align-self: stretch; justify-content: center; }
    .toolbar button { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); transition: transform 160ms var(--ease-out); }
    .toolbar button:active:not(:disabled) { transform: scale(.97); }
    .toolbar button:disabled { opacity: .4; cursor: default; }
    #stage { position: relative; flex: none; height: min(calc(100vh - 160px), 760px); aspect-ratio: var(--ratio); border-radius: 22px; overflow: hidden; border: 5px solid #111; background: #000; touch-action: none; user-select: none; }
    #stage > img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .box { position: absolute; border: 2px solid var(--c); border-radius: 5px; background: color-mix(in srgb, var(--c) 10%, transparent); }
    .box > b { position: absolute; top: -2px; left: -2px; min-width: 16px; padding: 0 4px; border-radius: 4px 0 4px 0; background: var(--c); color: #fff; font-size: 10px; line-height: 16px; text-align: center; }
    .box[data-selected] { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
    button.box { cursor: pointer; transition: background-color 150ms ease; }
    .cue { position: absolute; left: 50%; transform: translateX(-50%); padding: 4px 11px; border-radius: 999px; background: #222834d9; color: #fff; font-size: 11px; text-align: center; }
    .cue.top { top: 8px; } .cue.bottom { bottom: 8px; }
    .caption { color: var(--muted); font-size: 12px; min-height: 1.4em; text-align: center; }
    aside { overflow: auto; padding: 20px 22px 40px; border-left: 1px solid var(--line); }
    aside h2 { margin: 0; font-size: 18px; }
    aside h2 small { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; font-weight: 400; }
    ol.entrances { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 2px; }
    .entrance { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 0; border-radius: 8px; }
    .locate { display: grid; flex: 1; grid-template-columns: 20px 10px minmax(0, 1fr); align-items: center; gap: 8px; min-width: 0; padding: 8px 0 8px 8px; }
    .entrance[data-selected] { background: var(--chip); }
    .entrance .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; }
    .entrance .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .entrance .to { max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .entrance.done .to { color: var(--done); }
    button.to { padding: 4px 6px; border-radius: 6px; }
    .empty { color: var(--muted); font-size: 13px; margin-top: 16px; }
    @media (hover: hover) and (pointer: fine) {
      .node:hover, .entrance:hover { background: var(--chip); }
      button.to:hover { background: color-mix(in srgb, var(--done) 16%, transparent); }
      .link:hover { color: var(--todo); }
      button.box:hover { background: color-mix(in srgb, var(--c) 24%, transparent); }
      .toolbar button:hover:not(:disabled) { background: var(--chip); }
    }
    @media (max-width: 1000px) {
      main { grid-template-columns: 1fr; height: auto; }
      nav { max-height: 40vh; border-right: 0; border-bottom: 1px solid var(--line); }
      aside { border-left: 0; border-top: 1px solid var(--line); }
      #stage { height: 70vh; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script id="mock-data" type="application/json">__MOCK_DATA__</script>
  <script>__MOCK_SCRIPT__</script>
</body>
</html>
