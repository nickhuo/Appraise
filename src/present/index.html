<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appraise · Rewarded flow</title>
  <style>
    :root {
      --ink: #111a24; --ink-2: #4d5b69; --ink-3: #7a8896; --accent: #2a5bd7; --accent-soft: #e8eefb;
      --line: #e3e8ef; --paper: #ffffff; --canvas: #eef1f5; --bezel: #111a24;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink); background: var(--canvas); -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    /* Slides are a fixed 1600x900 (16:9) canvas; script scales the canvas to fit the window. */
    .deck { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 24px; }
    .frame { width: calc(1600px * var(--scale, 1)); height: calc(900px * var(--scale, 1)); }
    .canvas { width: 1600px; height: 900px; transform: scale(var(--scale, 1)); transform-origin: 0 0; }
    .slide { display: none; flex-direction: column; width: 1600px; height: 900px; padding: 52px 64px; background: var(--paper); border-radius: 14px; box-shadow: 0 0 0 1px #111a240d, 0 1px 2px #111a240a, 0 20px 48px -16px #26374d26; overflow: hidden; }
    .slide.active { display: flex; }
    .slide-top { display: flex; justify-content: space-between; gap: 20px; color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
    .slide-top span:first-child { color: var(--accent); }
    h1 { max-width: 22em; margin: 20px 0 10px; font-size: 44px; font-weight: 700; line-height: 1.08; letter-spacing: -.024em; text-wrap: balance; }
    .lead { max-width: 44em; margin: 0; color: var(--ink-2); font-size: 19px; line-height: 1.45; text-wrap: pretty; }
    .story { flex: 1; display: grid; grid-template-columns: auto auto auto minmax(260px, 460px); align-items: center; justify-content: center; column-gap: 40px; padding-top: 28px; }
    .phone-wrap { min-width: 0; margin: 0; }
    .phone-label { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--ink-2); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; }
    .phone-tag { padding: 3px 8px; border-radius: 999px; background: #eef1f5; color: var(--ink-3); font-size: 10px; letter-spacing: .04em; }
    .phone-tag.proposed { background: var(--accent-soft); color: var(--accent); }
    .phone { position: relative; display: flex; flex-direction: column; height: 500px; aspect-ratio: 9 / 20; overflow: hidden; border: 6px solid var(--bezel); border-radius: 30px; background: #f6f8fb; box-shadow: 0 1px 2px #111a2414, 0 18px 36px -14px #26374d40; }
    .observed-screen { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
    .app-head { display: flex; flex: none; align-items: center; gap: 8px; height: 50px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #fff; font-size: 13px; }
    .app-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--ink); color: #fff; font-size: 13px; font-weight: 700; }
    .demo-screen { flex: 1; background: #f6f8fb; }
    .scrim { position: absolute; inset: 0; background: #0b0f1499; }
    .overlay { position: absolute; color: var(--ink); font-size: 11px; line-height: 1.4; }
    .overlay strong { display: block; font-size: 12px; font-weight: 600; overflow-wrap: anywhere; }
    .overlay small { display: block; margin-top: 2px; color: var(--ink-2); font-size: 10px; }
    .overlay.banner { left: 10px; right: 10px; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--paper); box-shadow: 0 0 0 1px #111a2412, 0 10px 24px -8px #0b0f1473; }
    .overlay.banner { bottom: 14%; }
    .overlay.use { left: 0; right: 0; bottom: 14%; display: flex; flex-direction: column; gap: 8px; padding: 28px 10px 0; background: linear-gradient(to bottom, transparent, #000000c2 26%); }
    .overlay.use > .request { align-self: flex-end; max-width: 80%; margin: 0; padding: 8px 11px; border-radius: 14px 14px 4px 14px; background: #2b3a67; color: #fff; font-size: 11px; line-height: 1.4; }
    .response { padding: 10px 12px; border-radius: 14px 14px 14px 4px; background: var(--paper); box-shadow: 0 0 0 1px #111a2412, 0 10px 24px -8px #0b0f1473; }
    .response p { margin: 6px 0 0; font-size: 11px; line-height: 1.45; }
    .reward-badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: #dcf5e8; color: #11794b; font-size: 10px; font-weight: 700; }
    .overlay.sheet { left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; padding: 10px 14px 16px; border-radius: 18px 18px 0 0; background: var(--paper); box-shadow: 0 -8px 24px #0b0f1466; }
    .overlay.sheet::before { content: ""; align-self: center; width: 32px; height: 4px; margin-bottom: 14px; border-radius: 2px; background: var(--line); }
    .overlay.full { inset: 0; display: flex; flex-direction: column; padding: 14px; background: #0d1117; color: #fff; }
    .overlay h3 { margin: 0 0 6px; font-size: 18px; line-height: 1.2; letter-spacing: -.015em; text-wrap: balance; overflow-wrap: anywhere; }
    .overlay > p:not(.mock-eyebrow) { margin: 0 0 14px; color: var(--ink-2); font-size: 11px; line-height: 1.45; text-wrap: pretty; }
    .mock-eyebrow { margin: 0 0 6px; color: var(--ink-3); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .mock-button { margin-top: 8px; padding: 10px; border-radius: 11px; background: var(--ink); color: #fff; text-align: center; font-size: 12px; font-weight: 600; }
    .mock-button.secondary { background: #eef1f5; color: var(--ink); }
    .play, .info { display: grid; flex: none; place-items: center; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; font-weight: 700; }
    .play { background: var(--ink); color: #fff; }
    .info { background: #eef1f5; color: var(--ink-2); font-style: italic; }
    .ad-top { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-variant-numeric: tabular-nums; }
    .ad-top span:first-child { padding: 4px 9px; border-radius: 999px; background: #ffffff1f; }
    .ad-close { font-size: 16px; opacity: .35; }
    .ad-creative { display: grid; flex: 1; place-items: center; margin: 14px 0; border-radius: 12px; background: linear-gradient(160deg, #3a4a7a, #1b2340 55%, #0d1117); color: #ffffffa6; font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }
    .ad-progress { height: 3px; border-radius: 3px; background: #ffffff26; }
    .ad-progress span { display: block; width: 70%; height: 100%; border-radius: inherit; background: #fff; }
    .flow-arrow { align-self: center; margin-top: 24px; color: #9aaccb; font-size: 28px; line-height: 1; text-align: center; }
    .notes { align-self: center; max-width: 520px; margin-left: 24px; padding-left: 28px; border-left: 1px solid var(--line); }
    .notes h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; line-height: 1.3; }
    .notes p { margin: 0 0 24px; color: var(--ink-2); font-size: 16px; line-height: 1.5; text-wrap: pretty; overflow-wrap: anywhere; }
    .notes .source { margin: 8px 0 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 11px; line-height: 1.5; }
    .empty p { max-width: 36em; margin-top: 24px; color: var(--ink-2); font-size: 20px; line-height: 1.45; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: calc(1600px * var(--scale, 1)); padding: 0 4px; color: var(--ink-2); font-size: 13px; }
    .controls-group { display: flex; align-items: center; gap: 10px; }
    .controls button { display: grid; place-items: center; width: 40px; height: 40px; border: 0; border-radius: 10px; background: var(--paper); box-shadow: 0 0 0 1px #111a2414, 0 1px 2px #111a240f; color: var(--ink); cursor: pointer; transition: transform 160ms var(--ease-out), background-color 150ms ease; }
    .controls button:active:not(:disabled) { transform: scale(.97); }
    .controls button:disabled { opacity: .4; cursor: default; }
    @media (hover: hover) and (pointer: fine) { .controls button:hover:not(:disabled) { background: #f6f8fb; } }
    #position { min-width: 3.5em; text-align: center; font-variant-numeric: tabular-nums; }
    .mock-link { margin-right: 8px; color: var(--accent); font-weight: 600; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    @media print {
      :root { background: white; }
      .deck { padding: 0; gap: 0; }
      .frame, .canvas { width: 1600px; height: auto; transform: none; }
      .slide, .slide.active { display: flex; border-radius: 0; box-shadow: none; break-after: page; }
      .controls { display: none; }
      @page { size: 1600px 900px; margin: 0; }
    }
  </style>
</head>
<body>
  <main class="deck" aria-label="Rewarded advertising proposal">
    <div class="frame"><div class="canvas">__SLIDES__</div></div>
    <nav class="controls" aria-label="Slide navigation">
      <span>__DEMO_LABEL__</span>
      <div class="controls-group">
        __MOCK_LINK__
        <button id="previous" type="button" aria-label="Previous slide">←</button>
        <span id="position" aria-live="polite"></span>
        <button id="next" type="button" aria-label="Next slide">→</button>
      </div>
    </nav>
  </main>
  <script>
    const slides = [...document.querySelectorAll(".slide")];
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const position = document.getElementById("position");
    let index = 0;
    function showSlide(nextIndex) {
      index = Math.max(0, Math.min(slides.length - 1, nextIndex));
      slides.forEach((slide, slideIndex) => {
        slide.classList.toggle("active", slideIndex === index);
        slide.setAttribute("aria-hidden", String(slideIndex !== index));
      });
      previous.disabled = index === 0;
      next.disabled = index === slides.length - 1;
      position.textContent = `${index + 1} / ${slides.length}`;
      window.location.hash = `slide-${index + 1}`;
    }
    previous.addEventListener("click", () => showSlide(index - 1));
    next.addEventListener("click", () => showSlide(index + 1));
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") showSlide(index - 1);
      if (event.key === "ArrowRight") showSlide(index + 1);
    });
    function fit() {
      const scale = Math.min((window.innerWidth - 48) / 1600, (window.innerHeight - 48 - 54) / 900);
      document.documentElement.style.setProperty("--scale", String(Math.max(scale, 0.2)));
    }
    window.addEventListener("resize", fit);
    fit();
    showSlide(Number(window.location.hash.replace("#slide-", "")) - 1 || 0);
  </script>
</body>
</html>
